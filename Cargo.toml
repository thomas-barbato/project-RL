[package]
name = "project-rl"
version = "0.1.0"
edition = "2024"

[dependencies]
json5 = "0.4"
macroquad = "0.4.16"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[patch.crates-io]
# Keep OpenGL's texture-binding cache coherent when the font atlas grows.
miniquad = { path = "vendor/miniquad" }
