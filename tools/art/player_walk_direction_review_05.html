<div id="walk05-directions">
  <div class="viz-controls">
    <label class="form-label">Personnage
      <select class="form-select" data-control="actor">
        <option value="traqueuse">01 · Traqueuse, fusil équipé</option>
        <option value="bastion">Référence · Bastion d’origine</option>
      </select>
    </label>
    <label class="form-label">Durée d’une case
      <select class="form-select" data-control="duration">
        <option value="120">120 ms</option>
        <option value="200">200 ms</option>
        <option value="400" selected>400 ms</option>
      </select>
    </label>
    <label class="form-label">Sol
      <select class="form-select" data-control="ground">
        <option value="dark">Sombre</option>
        <option value="light">Clair</option>
        <option value="textured">Texturé</option>
      </select>
    </label>
  </div>
  <div class="viz-row">
    <button type="button" class="btn" data-control="play">Pause</button>
    <button type="button" class="btn" data-control="cell">Une case</button>
    <button type="button" class="btn" data-control="frame">Image suivante</button>
    <span class="text-small tabular-nums" data-control="status" aria-live="polite">400 ms · 3 images par case</span>
  </div>
  <div class="walk05-scenes">
    <figure>
      <figcaption>64 px · déplacement d’une case</figcaption>
      <canvas width="288" height="224" data-scene="native" role="img" aria-label="Taille native : ligne du haut vers la gauche, ligne du bas vers la droite, une case par déplacement"></canvas>
    </figure>
    <figure>
      <figcaption>Détail ×2 · marche sur place</figcaption>
      <canvas width="288" height="352" data-scene="detail" role="img" aria-label="Détail agrandi des jambes et du fusil : haut orienté à gauche et bas orienté à droite"></canvas>
    </figure>
  </div>
</div>
<style>
  #walk05-directions .walk05-scenes { display:flex; flex-wrap:wrap; gap:20px; align-items:center; justify-content:center; margin-top:16px; }
  #walk05-directions figure { margin:0; max-width:100%; }
  #walk05-directions figcaption { margin-bottom:8px; color:var(--foreground); }
  #walk05-directions canvas { display:block; width:288px; max-width:100%; height:auto; image-rendering:pixelated; }
</style>
<script>
(() => {
  const root = document.getElementById('walk05-directions');
  const data = __WALK05_DATA__;
  const control = name => root.querySelector(`[data-control="${name}"]`);
  const nativeCanvas = root.querySelector('[data-scene="native"]');
  const detailCanvas = root.querySelector('[data-scene="detail"]');
  const images = {};
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let state = {actor:'traqueuse', duration:400, ground:'dark'};
  let running = !reduced, oneCell = false, elapsed = 0, previous = null;
  let manualFrame = null, step = 0, ready = false;
  const groundColors = {
    dark: {fill:'#293339', grid:'#39454a', text:'#edece6'},
    light: {fill:'#b9b5a8', grid:'#a4a092', text:'#273037'},
    textured: {fill:'#555d56', grid:'#444f47', text:'#f0eee1'}
  };

  function applySaved(value) {
    const saved = value && value.modelContent;
    if (!saved || typeof saved !== 'object') return;
    if (saved.actor === 'bastion' || saved.actor === 'traqueuse') state.actor = saved.actor;
    if ([120,200,400].includes(saved.duration)) state.duration = saved.duration;
    if (Object.hasOwn(groundColors, saved.ground)) state.ground = saved.ground;
    for (const name of ['actor','duration','ground']) control(name).value = state[name];
    elapsed = 0; manualFrame = null; updateStatus();
  }
  function save() {
    if (window.openai?.setWidgetState) {
      window.openai.setWidgetState({modelContent:{...state},privateContent:null}).catch(() => {});
    }
  }
  function updateStatus() {
    control('play').textContent = running ? 'Pause' : 'Lecture';
    control('status').textContent = manualFrame === null
      ? `${state.duration} ms · 3 images par case`
      : `Image ${manualFrame + 1} / 6`;
  }
  function poseAt(time) {
    if (manualFrame !== null) return {frame:manualFrame, progress:0};
    const t = Math.min(1, Math.max(0, time / state.duration));
    return {frame:(step % 2) * 3 + Math.min(2,Math.floor(t * 3)), progress:1-(1-t)*(1-t)};
  }
  function scene(canvas, detail, pose) {
    const ctx = canvas.getContext('2d');
    const colors = groundColors[state.ground];
    const spriteSize = detail ? 128 : 64;
    const rowHeight = detail ? 176 : 112;
    const tile = detail ? 128 : 64;
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = colors.fill;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    for (let row=0;row<2;row++) {
      const top = row * rowHeight;
      const bottom = top + rowHeight - 9;
      if (state.ground === 'textured') {
        ctx.fillStyle = '#687066';
        for (let y=top+28;y<bottom;y+=8) {
          for (let x=0;x<288;x+=12) {
            if (((x*7+y*13)%19)<8) ctx.fillRect(x+(y%5),y,2,1);
          }
        }
      }
      ctx.strokeStyle = colors.grid;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x=16;x<288;x+=tile) {ctx.moveTo(x+.5,top+28);ctx.lineTo(x+.5,bottom+6);}
      ctx.moveTo(0,bottom+.5);ctx.lineTo(288,bottom+.5);
      ctx.stroke();
      ctx.fillStyle = colors.text;
      ctx.font = getComputedStyle(root).font;
      ctx.fillText(row===0 ? '← Gauche' : 'Droite →',12,top+20);
      const x = detail ? 144 : (row===0 ? 208-64*pose.progress : 80+64*pose.progress);
      ctx.drawImage(images[state.actor],pose.frame*64,row*64,64,64,
        Math.round(x-spriteSize/2),bottom-spriteSize,spriteSize,spriteSize);
    }
  }
  function draw() {
    if (!ready) return;
    const pose = poseAt(elapsed);
    scene(nativeCanvas,false,pose);scene(detailCanvas,true,pose);
  }
  function tick(now) {
    const delta = previous === null ? 0 : Math.min(64,now-previous);
    previous = now;
    if (running && ready) {
      elapsed += delta;
      if (oneCell && elapsed >= state.duration) {
        elapsed = state.duration;running=false;oneCell=false;updateStatus();
      } else if (!oneCell && elapsed >= state.duration+520) {
        elapsed -= state.duration+520;step++;
      }
    }
    draw();requestAnimationFrame(tick);
  }
  for (const name of ['actor','duration','ground']) {
    control(name).addEventListener('change', () => {
      state[name] = name==='duration' ? Number(control(name).value) : control(name).value;
      elapsed=0;manualFrame=null;step=0;updateStatus();save();draw();
    });
  }
  control('play').addEventListener('click', () => {
    if (manualFrame !== null || elapsed >= state.duration) elapsed=0;
    manualFrame=null;oneCell=false;running=!running;updateStatus();draw();
  });
  control('cell').addEventListener('click', () => {
    elapsed=0;manualFrame=null;oneCell=true;running=true;step++;
    updateStatus();draw();
  });
  control('frame').addEventListener('click', () => {
    manualFrame = ((manualFrame ?? poseAt(elapsed).frame)+1)%6;
    running=false;oneCell=false;updateStatus();draw();
  });
  document.addEventListener('visibilitychange', () => {previous=null;});
  window.addEventListener('openai:set_globals', event => {
    if (event.detail?.globals?.widgetState) {applySaved(event.detail.globals.widgetState);draw();}
  });
  applySaved(window.openai?.widgetState);
  Promise.all(Object.entries(data).map(([key,url]) => new Promise((resolve,reject) => {
    const image = new Image();image.onload=() => {images[key]=image;resolve();};
    image.onerror=reject;image.src=url;
  }))).then(() => {ready=true;updateStatus();draw();}).catch(() => {
    control('status').textContent='Impossible de charger les dessins';
    control('status').setAttribute('role','alert');
  });
  updateStatus();requestAnimationFrame(tick);
})();
</script>
