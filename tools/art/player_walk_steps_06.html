<div id="rl-bastion-method-steps">
  <div class="viz-controls">
    <button class="btn btn-primary" type="button" data-action="play">Pause</button>
    <button class="btn" type="button" data-action="cell">Avancer d’une case</button>
    <button class="btn" type="button" data-action="step">Image suivante</button>
    <label class="form-label">Une case
      <select class="form-select" data-control="pace"><option value="120">120 ms</option><option value="200">200 ms</option><option value="400" selected>400 ms</option></select>
    </label>
    <label class="form-label">Sol
      <select class="form-select" data-control="floor"><option value="dark">Sombre</option><option value="light">Clair</option><option value="textured">Texturé</option></select>
    </label>
  </div>
  <div class="walk-comparison">
    <section>
      <h3>Référence · Bastion « 02 »</h3>
      <div class="text-small">Taille native · 64 × 64</div>
      <canvas data-scene="0" width="288" height="256" role="img" aria-label="Bastion d'origine : marche de trois quarts à droite et à gauche, avec retour à la pose de repos après chaque case"></canvas>
      <div class="text-small">Détail ×2</div>
      <canvas data-zoom="0" width="128" height="128" role="img" aria-label="Détail deux fois plus grand du Bastion d'origine"></canvas>
    </section>
    <section>
      <h3>01 · Traqueuse, fusil équipé</h3>
      <div class="text-small">Taille native · 64 × 64</div>
      <canvas data-scene="1" width="288" height="256" role="img" aria-label="Nouvel essai de la Traqueuse : marche avec appuis alternés et retour à la pose de repos après chaque case"></canvas>
      <div class="text-small">Détail ×2</div>
      <canvas data-zoom="1" width="128" height="128" role="img" aria-label="Détail deux fois plus grand de la Traqueuse avec son fusil"></canvas>
    </section>
  </div>
  <div class="viz-row text-small" aria-live="polite"><span data-grid-status>À l’arrêt</span><span data-status>Chargement des poses…</span></div>
</div>
<style>
  #rl-bastion-method-steps .walk-comparison {display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin-top:16px}
  #rl-bastion-method-steps section {min-width:0;max-width:100%;text-align:center}
  #rl-bastion-method-steps h3 {margin-bottom:6px}
  #rl-bastion-method-steps canvas {display:block;image-rendering:pixelated;margin:8px auto;max-width:100%;height:auto}
  #rl-bastion-method-steps [data-scene] {width:288px}
  #rl-bastion-method-steps [data-zoom] {width:128px}
</style>
<script>
(()=>{
  const root=document.getElementById('rl-bastion-method-steps');
  const DATA=__WALK_STEP_DATA__;
  const scenes=Array.from(root.querySelectorAll('[data-scene]'));
  const zooms=Array.from(root.querySelectorAll('[data-zoom]'));
  const tiles=Array.from({length:2},()=>{const c=document.createElement('canvas');c.width=c.height=64;return c;});
  const actors=DATA.actors.map(item=>({atlas:new Image(),idle:new Image(),data:item}));
  const initial=window.openai?.widgetState?.modelContent||{};
  const state={playing:!matchMedia('(prefers-reduced-motion: reduce)').matches,automatic:true,pace:[120,200,400].includes(+initial.pace)?+initial.pace:400,floor:['dark','light','textured'].includes(initial.floor)?initial.floor:'dark'};
  let loaded=0,previous=0,lastSide=1,index=0,transition=null,rest=0,stepCount=0;
  const play=root.querySelector('[data-action="play"]');
  const status=root.querySelector('[data-status]');
  const gridStatus=root.querySelector('[data-grid-status]');
  const colors={dark:{base:'#293132',tile:'#303a3b',line:'#414b49',crack:'#1c2425',shadow:'rgba(4,9,12,.5)'},light:{base:'#b5afa0',tile:'#bdb6a7',line:'#999689',crack:'#a09a8c',shadow:'rgba(28,30,29,.32)'}};
  const route=[[80,144],[208,144],[80,144]];
  function cells(){const result=[route[0]];for(const target of route.slice(1)){const from=result[result.length-1],count=Math.max(Math.abs(target[0]-from[0]),Math.abs(target[1]-from[1]))/64;for(let i=1;i<=count;i++)result.push([from[0]+(target[0]-from[0])*i/count,from[1]+(target[1]-from[1])*i/count]);}return result;}
  function remember(){window.openai?.setWidgetState?.({modelContent:{pace:state.pace,floor:state.floor},privateContent:null}).catch(()=>{});}
  function sync(){play.textContent=state.playing?'Pause':'Lecture auto';for(const key of ['pace','floor'])root.querySelector(`[data-control="${key}"]`).value=String(state[key]);}
  function startStep(){
    if(transition)return;
    const points=cells();if(index>=points.length-1)index=0;
    const a=points[index],b=points[index+1],dx=b[0]-a[0];
    if(dx!==0)lastSide=dx>0?1:7;
    transition={from:a,to:b,age:0};gridStatus.textContent='Une case · déplacement';
  }
  function advance(delta){
    if(transition){transition.age+=delta;if(transition.age>=state.pace){index++;stepCount++;transition=null;rest=0;gridStatus.textContent='Arrêt sur la case';if(!state.automatic){state.playing=false;sync();}}}
    else if(state.automatic){rest+=delta;if(rest>=520)startStep();}
  }
  function location(){
    if(!transition){const at=cells()[index];return {x:at[0],y:at[1],moving:false,frame:0,target:at};}
    const t=Math.min(1,transition.age/state.pace),p=1-(1-t)*(1-t),a=transition.from,b=transition.to;
    return {x:Math.round(a[0]+(b[0]-a[0])*p),y:Math.round(a[1]+(b[1]-a[1])*p),moving:true,frame:(stepCount%2)*3+Math.min(2,Math.floor(t*3)),target:b};
  }
  function drawTile(actorIndex,loc){
    const ctx=tiles[actorIndex].getContext('2d');ctx.clearRect(0,0,64,64);ctx.imageSmoothingEnabled=false;
    const row=lastSide,actor=actors[actorIndex];
    if(loc.moving)ctx.drawImage(actor.atlas,loc.frame*64,row*64,64,64,0,0,64,64);
    else ctx.drawImage(actor.idle,(row%4)*64,Math.floor(row/4)*64,64,64,0,0,64,64);
  }
  function floor(ctx,width,height){
    const c=colors[state.floor==='light'?'light':'dark'];ctx.fillStyle=c.base;ctx.fillRect(0,0,width,height);
    for(let y=-16;y<height;y+=64)for(let x=-16;x<width;x+=64){
      if((Math.floor(x/64)+Math.floor(y/64))%2===0){ctx.fillStyle=c.tile;ctx.fillRect(x,y,64,64);}
      ctx.strokeStyle=c.line;ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,64,64);
      if(state.floor==='textured'){
        ctx.strokeStyle=c.crack;ctx.beginPath();ctx.moveTo(x+14,y+22);ctx.lineTo(x+23,y+27);ctx.lineTo(x+28,y+24);ctx.stroke();
      }
    }
  }
  function render(){
    if(loaded<actors.length*2)return;
    const loc=location();
    scenes.forEach((canvas,actorIndex)=>{
      drawTile(actorIndex,loc);
      const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;floor(ctx,288,256);
      ctx.strokeStyle=state.floor==='light'?'#5a6868':'#90a4a7';ctx.lineWidth=1;ctx.strokeRect(loc.target[0]-31.5,loc.target[1]-31.5,63,63);
      ctx.fillStyle=colors[state.floor==='light'?'light':'dark'].shadow;ctx.beginPath();ctx.ellipse(loc.x,loc.y+30,17,5,0,0,Math.PI*2);ctx.fill();
      ctx.drawImage(tiles[actorIndex],loc.x-32,loc.y-32);
      const z=zooms[actorIndex].getContext('2d');z.imageSmoothingEnabled=false;floor(z,128,128);z.drawImage(tiles[actorIndex],0,0,64,64,0,0,128,128);
    });
    root.dataset.frame=String(loc.frame);root.dataset.direction=String(lastSide);root.dataset.ready='true';root.dataset.moving=String(loc.moving);root.dataset.cell=String(index);
  }
  function tick(now){if(previous&&state.playing)advance(Math.min(80,now-previous));previous=now;render();requestAnimationFrame(tick);}
  function ready(){loaded++;if(loaded===actors.length*2){status.textContent='Essai de revue · hors du jeu';render();}}
  for(const actor of actors){
    actor.atlas.onload=actor.idle.onload=ready;
    actor.atlas.onerror=actor.idle.onerror=()=>{status.textContent='Impossible de charger les poses.';status.setAttribute('role','alert');};
    actor.atlas.src=actor.data.atlas;actor.idle.src=actor.data.idle;
  }
  play.addEventListener('click',()=>{state.playing=!state.playing;if(state.playing)state.automatic=true;sync();});
  root.querySelector('[data-action="cell"]').addEventListener('click',()=>{state.automatic=false;startStep();state.playing=true;sync();});
  root.querySelector('[data-action="step"]').addEventListener('click',()=>{state.playing=false;state.automatic=false;if(transition)advance(state.pace/3);else startStep();sync();render();});
  for(const key of ['pace','floor'])root.querySelector(`[data-control="${key}"]`).addEventListener('change',e=>{state[key]=key==='pace'?+e.target.value:e.target.value;remember();render();});
  window.addEventListener('openai:set_globals',event=>{
    const saved=event.detail?.globals?.widgetState?.modelContent;
    if(!saved)return;
    if([120,200,400].includes(+saved.pace))state.pace=+saved.pace;
    if(['dark','light','textured'].includes(saved.floor))state.floor=saved.floor;
    sync();render();
  });
  document.addEventListener('visibilitychange',()=>{previous=0;});
  sync();requestAnimationFrame(tick);
})();
</script>
